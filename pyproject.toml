[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "llm-bus"
version = "0.1.0"
description = "Durable communication bus for coding agents"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
collab = ["iroh==1.1.0"]

[project.scripts]
llm-bus = "llm_bus:main"

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "clean-code-tools-python==1.0.7",
    "deptry==0.25.1",
    "iroh==1.1.0",
    "poethepoet==0.48.0",
    "pylint==4.0.8",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bus.py", "src/llm_bus_install.py", "src/llm_bus_store.py", "src/llm_bus_wake.py", "src/llm_bus_policy.py", "src/llm_bus_remote.py", "src/llm_bus_remote_store.py", "src/llm_bus_reports.py", "src/llm_bus_collab_cli.py", "src/llm_bus_collab_daemon.py", "src/llm_bus_collab_identity.py", "src/llm_bus_collab_responder.py", "src/llm_bus_collab_state.py", "src/llm_bus_collab_transport.py", "src/llm_bus_collab_web.py"]

[tool.hatch.build.targets.sdist]
exclude = ["/cloudflare/node_modules", "/cloudflare/.wrangler", "/cloudflare/dist", "/cloudflare/.dev.vars"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "A", "ARG", "ASYNC", "B", "C4", "C90", "DTZ", "E", "ERA", "F", "FBT", "FLY",
    "FURB", "I", "ICN", "ISC", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
    "RET", "RSE", "RUF", "S", "SIM", "SLOT", "T10", "T20", "TC", "TRY", "UP", "W",
]
ignore = [
    "E501",
    "ISC001",
    "TRY003", # Validation errors carry actionable boundary messages.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "S603"]
"src/llm_bus_remote.py" = ["T201"]
"src/llm_bus.py" = ["T201"] # Printing is the CLI and hook output boundary.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.basedpyright]
include = ["src", "tests", "plugins/herdr-history", "tools"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["src", "plugins/herdr-history"]
reportAny = "error"
reportExplicitAny = "error"
reportImplicitRelativeImport = "error"
reportInvalidCast = "error"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportPrivateLocalImportUsage = "error"
reportUnannotatedClassAttribute = "error"
reportUninitializedInstanceVariable = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src", "plugins/herdr-history"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'plugins/herdr-history')"
py-version = "3.12"
jobs = 0
recursive = true
load-plugins = ["clean_code_tools_pylint"]
ignore-paths = ["^.*/\\.venv/.*$", "^.*/build/.*$", "^.*/dist/.*$"]

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
]
enable = [
    "clean-code-boolean-flag-argument",
    "clean-code-business-policy-literal",
    "clean-code-commented-out-code",
    "clean-code-noisy-comment",
    "clean-code-output-argument-mutation",
    "clean-code-redundant-comment",
    "clean-code-todo-format",
    "clean-code-train-wreck",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.reports]
score = false

[tool.deptry]
known_first_party = ["llm_bus", "llm_bus_install", "llm_bus_store", "llm_bus_wake", "llm_bus_policy", "llm_bus_remote", "llm_bus_remote_store", "llm_bus_reports", "llm_bus_collab_cli", "llm_bus_collab_daemon", "llm_bus_collab_identity", "llm_bus_collab_responder", "llm_bus_collab_state", "llm_bus_collab_transport", "llm_bus_collab_web"]

[tool.poe.tasks]
format = "ruff format src tests plugins/herdr-history tools"
format-check = "ruff format --check src tests plugins/herdr-history tools"
lint = "ruff check --no-fix src tests plugins/herdr-history tools"
type-check = "basedpyright"
pylint.sequence = [
    { cmd = "pylint src" },
    # Viewer JSON records intentionally mirror the CLI contract without importing its code.
    { cmd = "pylint plugins/herdr-history tools" },
    # Ruff owns fixture formatting; literals and exact list assertions state expected results.
    { cmd = "pylint --disable=clean-code-business-policy-literal,use-implicit-booleaness-not-comparison,line-too-long tests" },
]
deptry = "deptry ."
test = "pytest"
build = "uv build"
package-check = "python tools/check_package.py"
check.sequence = ["format-check", "lint", "type-check", "pylint", "deptry", "test", "package-check"]
